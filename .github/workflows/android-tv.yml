name: Android TV

on:
  push:
    paths:
      - "androidtv/**"
      - ".github/workflows/android-tv.yml"
  workflow_dispatch:

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Unsigned APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        working-directory: androidtv
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kumo-tv-unsigned
          path: androidtv/app/build/outputs/apk/release/*.apk
          retention-days: 14
