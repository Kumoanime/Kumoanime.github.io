<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kumo</title>
<meta name="description" content="Anime browser and player that streams from the add-ons you install.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kumo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=4">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#/" aria-label="Kumo home"><span class="logo-mark" aria-hidden="true"><span>K</span></span><span class="logo-word" aria-hidden="true">KUMO</span></a>
    <button id="bellBtn" class="icon-btn bell push-right" aria-label="New episodes">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-1.7 1.7A1 1 0 0 0 4 19.4h16a1 1 0 0 0 .7-1.7Z"/></svg>
      <span id="bellCount" class="bell-count" hidden></span>
    </button>
    <button id="acctBtn" class="icon-btn bell" aria-label="Sign up or log in"></button>
  </div>
  <div id="notesPanel" class="notes-panel" hidden style="display:none"></div>
  <div id="acctPanel" class="notes-panel" hidden style="display:none"></div>
</header>

<main id="app" class="wrap"></main>

<nav class="dock" aria-label="Sections">
  <button id="searchBtn" class="dock-item" aria-label="Search" aria-expanded="false" data-tip="Search">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm5.4-2.1L21 21"/></svg>
  </button>
  <a href="#/" class="dock-item" data-tab="home" aria-label="Home" data-tip="Home">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M11.3 2.7a1 1 0 0 1 1.4 0l8.6 8.1c.6.6.2 1.7-.7 1.7H19v7.5a1 1 0 0 1-1 1h-3.5v-5.5h-5V21H6a1 1 0 0 1-1-1v-7.5H3.4c-.9 0-1.3-1.1-.7-1.7l8.6-8.1Z"/></svg>
  </a>
  <a href="#/list" class="dock-item" data-tab="list" aria-label="Watching" data-tip="Watching">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm6 4v6l5-3-5-3Z"/></svg>
  </a>
  <a href="#/addons" class="dock-item" data-tab="addons" aria-label="Add-ons" data-tip="Add-ons">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9 3a2.5 2.5 0 0 1 5 0v1h4a1 1 0 0 1 1 1v4h1a2.5 2.5 0 0 1 0 5h-1v5a1 1 0 0 1-1 1h-4.5v-1a2 2 0 0 0-4 0v1H5a1 1 0 0 1-1-1v-4.5h1a2 2 0 0 0 0-4H4V5a1 1 0 0 1 1-1h4V3Z"/></svg>
  </a>
</nav>
<form class="search-pop" id="searchForm" role="search" hidden style="display:none">
  <input id="q" type="search" placeholder="Search anime" autocomplete="off" aria-label="Search anime" enterkeyhint="search">
</form>

<div id="player" class="player" hidden style="display:none">
  <div class="player-top">
    <button id="playerClose" class="icon-btn" aria-label="Close player">←</button>
    <div class="player-title" id="playerTitle"></div>
  </div>
  <div class="player-stage" id="playerStage"></div>
</div>

<div id="toast" class="toast" hidden style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js?v=9"></script>
</body>
</html>
