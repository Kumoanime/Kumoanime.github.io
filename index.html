<body>
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-stage">
    <div class="splash-glow"></div>
    <div class="splash-wisp"></div>
    <div class="splash-wisp splash-wisp-b"></div>
    <div class="splash-logo">
      <span class="logo-mark" aria-hidden="true"><span>K</span></span>
      <span class="logo-word" aria-hidden="true">KUMO</span>
    </div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById("splash");
  if (!el) return;
  var reduce = false;
  try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var skip = document.documentElement.classList.contains("splash-skip");
  var gone = false;
  function remove() {
    if (gone) return;
    gone = true;
    document.documentElement.classList.add("splash-done");
    if (el.parentNode) el.parentNode.removeChild(el);
  }
  if (skip) { remove(); return; }
  el.addEventListener("animationend", function (e) {
    if (e.target === el) remove();
  });
  setTimeout(remove, reduce ? 500 : 2000);
  window.addEventListener("pageshow", function (e) { if (e.persisted) remove(); });
})();
</script>
