<style>
  html,body{margin:0;background:#000;color:#f4f4f4;color-scheme:dark}
  html{touch-action:manipulation}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(49px + env(safe-area-inset-bottom,0px))}
  #splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #splash .splash-k{width:200px;height:200px;flex:none}
  html.splash-skip #splash{display:none!important}
  .wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{position:sticky;top:0;z-index:7;background:#000;border-bottom:1px solid #262626;padding-top:env(safe-area-inset-top,0px)}
  .bar{display:flex;align-items:center;gap:14px;padding:10px 0}
  main{min-height:60vh}
  .cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#1e1e1e}
  .rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,150px);gap:12px;overflow-x:auto}
  .card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;min-width:0}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:6;box-sizing:border-box;display:flex;align-items:stretch;height:calc(49px + env(safe-area-inset-bottom,0px));padding:0 0 env(safe-area-inset-bottom,0px);background:#121212;border-top:1px solid #262626}
  .dock-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#a0a0a0;font-size:10px;font-weight:600;line-height:1.15;text-decoration:none}
  .logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
  .logo-mark{position:relative;width:34px;height:34px;border-radius:9px;background:#000;border:1px solid #262626;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .logo-mark span{font-family:"Dela Gothic One","Arial Black",system-ui,sans-serif;font-size:26px;line-height:1;transform:skewX(-10deg);margin-left:-2px;background:linear-gradient(180deg,#ffc432,#ff8a1f 55%,#ff6000);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-word{font-family:"Dela Gothic One","Arial Black",system-ui,sans-serif;font-size:24px;letter-spacing:.04em;transform:skewX(-10deg);background:linear-gradient(180deg,#ffd166 0%,#ff8a1f 55%,#ff5e00 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-mark::before,.logo-mark::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;transform:rotate(-37deg)}
  .logo-mark::before{height:3px;margin-top:-1px;background:#000}
  .logo-mark::after{height:2px;margin-top:2px;background:#ff8a1f}
  @font-face{font-family:"Dela Gothic One";font-style:normal;font-weight:400;font-display:swap;src:url("https://fonts.gstatic.com/s/delagothicone/v19/hESp6XxvMDRA-2eD0lXpDa6QkBA2QkEIYgpLUQ.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  .splash.splash-out{animation:splash-fade .2s ease forwards}
  @keyframes splash-fade{to{opacity:0;visibility:hidden}}
  @media (prefers-reduced-motion:reduce){#splash.splash.splash-out{animation:splash-fade .14s linear forwards!important}}
</style>
<script>
(function () {
  try {
    var nav = performance.getEntriesByType("navigation")[0];
    if (nav && nav.type === "back_forward") document.documentElement.classList.add("splash-skip");
  } catch (e) {}
  try {
    var hash = location.hash || "";
    var show = hash.match(/^#\/(?:a|watch)\/(\d+)/);
    var hero = show ? localStorage.getItem("kumo.hero." + show[1]) : "";
    if (!hero && (!hash || hash === "#" || hash === "#/")) {
      var snap = JSON.parse(localStorage.getItem("kumo.homeSnap") || "null");
      hero = snap && snap.lcp;
    }
    if (hero) {
      var link = document.createElement("link");
      link.rel = "preload";
      link.as = "image";
      link.href = hero;
      document.head.appendChild(link);
    }
  } catch (e) {}
})();
</script>

<script>
(function () {
  var el = document.getElementById("splash");
  if (!el) return;
  var reduce = false;
  try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var skip = document.documentElement.classList.contains("splash-skip");
  var minHold = 800, maxHold = 2500, fadeMs = reduce ? 140 : 200;
  var started = performance.now();
  var ready = false, fading = false, gone = false, timer = 0;
  function remove() {
    if (gone) return;
    gone = true;
    clearTimeout(timer);
    document.documentElement.classList.add("splash-done");
    if (el.parentNode) el.parentNode.removeChild(el);
  }
  function fade() {
    if (fading || gone) return;
    fading = true;
    clearTimeout(timer);
    el.classList.add("splash-out");
    setTimeout(remove, fadeMs + 80);
  }
  function poke() {
    if (fading || gone) return;
    var elapsed = performance.now() - started;
    if (elapsed >= maxHold || (ready && elapsed >= minHold)) { fade(); return; }
    clearTimeout(timer);
    timer = setTimeout(poke, (ready ? minHold : maxHold) - elapsed);
  }
  if (skip) { remove(); return; }
  function markReady() {
    var app = document.getElementById("app");
    if (!app || ready) return;
    if (app.childElementCount > 0) { ready = true; poke(); }
  }
  function watch() {
    markReady();
    var app = document.getElementById("app");
    if (!app || ready) return;
    var obs = new MutationObserver(function () {
      markReady();
      if (ready) obs.disconnect();
    });
    obs.observe(app, { childList: true });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", watch);
  else watch();
  poke();
  el.addEventListener("animationend", function (e) { if (e.target === el) remove(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) remove(); });
})();
</script>
